	<style>
		@import url('https://fonts.googleapis.com/css?family=Roboto+Slab:100,300');
		@import url('https://fonts.googleapis.com/css?family=Abril+Fatface');
		@import url('https://fonts.googleapis.com/css2?family=Teko:wght@300&display=swap');
		@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap');

		/* ============================================================
		   Justified Rows — Adapted to RJ.css styling
		   Group photos into ".row" divs yourself — 1, 2, 3, or more per
		   row. Just drop in:
		     <figure class="photo">
		       <img src="..._small.webp" data-full="....jpg" alt="..." loading="lazy">
		     </figure>
		   — no dimensions to type. The script at the bottom of this page
		   reads each photo's real pixel size once it loads and sets
		   --ar (width / height) on it automatically.

		   Flexbox grows every photo in a row proportional to --ar until
		   the row fills the full width — since growth matches each
		   photo's own ratio, they all land on the same height. No
		   cropping, only scaling.

		   A row with one photo becomes a full-width HERO photo automatically,
		   and automatically uses its full-resolution image (data-full).

		   Want deliberate whitespace instead? Give that photo
		   class="photo--inset" and set its own width directly (e.g.
		   style="flex-basis: 66.67%" for 2/3), then use justify-content
		   on the .row to choose where the leftover space sits:
		     justify-content: flex-start  -> photo left, gap on the right
		     justify-content: center      -> gap split evenly both sides
		     justify-content: flex-end    -> photo right, gap on the left

		   THE STACK CASE — two photos stacked on the left, matched by
		   one tall photo on the right — is a ".photo--stack": a column
		   of 2 photos that counts as ONE item in the row. Set --ar by
		   hand (roughly 1 / (1/ar1 + 1/ar2), nudged by eye for the gap)
		   or omit --ar to let the script estimate it automatically.
		   ============================================================ */

		:root {
			--gap: 20px;
			--gutter: 0px;
			--serif: 'Lora', serif;
			--sans: 'Teko', sans-serif;
			--slab: 'Roboto Slab', serif;
			--text: #313131;
			--muted: gray;
			--rule: #b3b3b3;
		}

		.rows {
			padding: 0 var(--gutter) var(--gap);
		}

		.rows .row {
			display: flex;
			gap: var(--gap);
			margin-bottom: var(--gap);
			align-items: flex-start;
		}

		.rows .row>.photo {
			margin: 0;
			flex-grow: var(--ar, 1);
			flex-shrink: 1;
			flex-basis: 0;
			min-width: 0;
		}

		.rows .row img {
			display: block;
			width: 100%;
			height: auto;
			max-height: none;
			cursor: pointer;
		}

		/* Guarantee: a photo alone in a row always fills the full width
		   (but never overrides an inset photo's deliberate whitespace) */
		.rows .row>.photo:only-child:not(.photo--inset) {
			flex-grow: 1;
		}

		/* An "inset" photo opts out of growing — it keeps a fixed width
		   you set yourself, leaving the rest of the row as whitespace */
		.rows .row>.photo--inset {
			flex-grow: 0;
		}

		/* Two (or more) photos stacked vertically as a single row item */
		.rows .photo--stack {
			display: flex;
			flex-direction: column;
			gap: var(--gap);
		}

		.rows .photo--stack figure {
			margin: 0;
		}

		.rows .photo--stack img {
			width: 100%;
			height: auto;
			max-height: none;
			display: block;
		}

		/* Optional caption under any figure */
		.rows figcaption {
			color: var(--muted);
			font-family: var(--serif);
			font-size: 11px;
			font-style: italic;
			text-align: right;
			margin-top: 4px;
			line-height: 1.3;
		}

		/* Text grid item inside a row — styled with main site fonts & lines */
		.rows .photo--text {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-self: stretch;
			padding: clamp(1.25rem, 2.5vw, 2.25rem);
			border-top: 1px solid var(--rule);
			border-bottom: 1px solid var(--rule);
			font-family: var(--serif);
			box-sizing: border-box;
		}

		.rows .photo--text .text-kicker {
			font-family: var(--slab);
			font-weight: 300;
			font-size: 12px;
			letter-spacing: 0.5px;
			text-transform: uppercase;
			color: var(--muted);
			margin-bottom: 8px;
			display: block;
		}

		.rows .photo--text h5 {
			margin-top: 0;
			margin-bottom: 10px;
		}

		.rows .photo--text p {
			margin: 0;
			font-size: 15px;
			line-height: 1.6;
			color: var(--text);
		}

		/* Essay / section break between .rows groups */
		.essay {
			max-width: 750px;
			margin: 40px 0;
			padding: 20px 0;
			border-top: 1px solid var(--rule);
			border-bottom: 1px solid var(--rule);
			font-family: var(--serif);
			color: var(--text);
		}

		.essay h6 {
			margin-top: 0;
			margin-bottom: 6px;
		}

		.essay p {
			margin: 0;
			font-size: 15px;
			line-height: 1.6;
		}

		@media (max-width: 640px) {
			.rows .row {
				flex-wrap: wrap;
			}

			.rows .row>.photo,
			.rows .row>.photo--inset {
				flex-basis: 100% !important;
				flex-grow: 0;
			}
		}
	</style>
</head>

	<script>
		// Automatically use the full-resolution image (data-full) whenever a photo
		// is placed alone in a full-width row.
		document.querySelectorAll('.rows .row > .photo:only-child:not(.photo--inset) img[data-full]').forEach(img => {
			const fullSrc = img.getAttribute('data-full');
			if (fullSrc && img.getAttribute('src') !== fullSrc) {
				img.setAttribute('src', fullSrc);
			}
		});

		// Auto-detect each photo's real aspect ratio and set --ar on it,
		// so the CSS above doesn't need width/height typed in by hand.
		document.querySelectorAll('.rows .row > .photo:not(.photo--stack):not(.photo--inset):not(.photo--text)').forEach(photo => {
			const img = photo.querySelector('img');
			if (!img) return;
			const setRatio = () => {
				if (img.naturalWidth && img.naturalHeight) {
					photo.style.setProperty('--ar', img.naturalWidth / img.naturalHeight);
				}
			};
			if (img.complete && img.naturalWidth) {
				setRatio();
			} else {
				img.addEventListener('load', setRatio, { once: true });
			}
		});

		// Also auto-estimate --ar for .photo--stack if not set manually via inline style="--ar: ..."
		document.querySelectorAll('.rows .row > .photo--stack').forEach(stack => {
			if (stack.style.getPropertyValue('--ar')) return;
			const imgs = Array.from(stack.querySelectorAll('img'));
			if (!imgs.length) return;
			const updateStackRatio = () => {
				if (imgs.every(img => img.naturalWidth && img.naturalHeight)) {
					const invSum = imgs.reduce((sum, img) => sum + (img.naturalHeight / img.naturalWidth), 0);
					if (invSum > 0) {
						stack.style.setProperty('--ar', (1 / invSum).toFixed(3));
					}
				}
			};
			imgs.forEach(img => {
				if (img.complete && img.naturalWidth) {
					updateStackRatio();
				} else {
					img.addEventListener('load', updateStackRatio, { once: true });
				}
			});
		});
	</script>
	<script src="imageModal.js"></script>
</body>

</html>
